xwayland {
	force_zero_scaling = true
}

general {
    gaps_in = 1
    gaps_out = 10

    border_size = 1

    col.active_border = rgba(ffffff00)
    col.inactive_border = rgba(59595900)

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 7
    rounding_power = 2

    active_opacity = 1
    inactive_opacity = 1

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
	    new_optimizations = true
        vibrancy = 0.5
	    vibrancy_darkness = 0.6
	    brightness = 1
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.1, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, slide top
    animation = windowsOut, 1, 1.49, linear, slide bottom
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, slide top
    animation = layersOut, 1, 1.5, linear, fade 80%
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, easeInOutCubic, slide
    animation = workspacesIn, 1, 4, easeInOutCubic, slide
    animation = workspacesOut, 1, 4, easeInOutCubic, slide
    animation = specialWorkspaceIn, 1, 4, easeInOutCubic, slidevert
    animation = specialWorkspaceOut, 1, 4, easeInOutCubic, slidevert
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
    mfact = 0.7
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}
