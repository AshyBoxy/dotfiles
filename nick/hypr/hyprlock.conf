$font = Inter Bold

general {
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/wps/wp3.jpg
    blur_passes = 2
}

image {
	monitor =
	size = 10%, 10%
	path = /var/lib/AccountsService/icons/$USER
	rounding = -1
	
	position = 0, 55px

	border_size = 0
}


label {
	monitor =
	size = 30%
	text = $USER
	font_size = 20
	position = 0, -65px
	font_family = $font
}


shape {
	monitor = 
	size = 400px, 150px
	color = rgba(20, 20, 20, 0.5)
	rounding = 20
	position= 0, 350px
}


shape {
        monitor =
        size = 600px, 400px
        color = rgba(20, 20, 20, 0.5)
        rounding = 20
	position = 0, -15px
}


label {
	monitor =
        size = 30%
        text = $TIME
        font_size = 90
        position = 0, 350px
        font_family = $font
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 1
    inner_color = rgba(100, 100, 100, 0.3) 
    outer_color = rgba(150, 150, 150, 0.5))

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -130px
    halign = center
    valign = center
}


